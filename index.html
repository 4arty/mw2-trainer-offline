<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MW2 // Тренажёр слов</title>
<style>
/* ============ Тактическая тёмная тема (MW2) ============ */
:root{
  --background:#0a0d10; --foreground:#e8e6e0; --card:#13181d;
  --primary:#a3b869; --primary-fg:#10140a;
  --muted-fg:#8b939b; --border:#2b333c; --input:#2b333c;
  --green:#b9d478; --green-dim:#6d8850; --amber:#d2a45c; --red:#d16a5f;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--background); color:var(--foreground);
  font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  font-size:14px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
::selection{background:#a3b86944}
button{font-family:inherit}
.tac-grid-bg{
  background-image:linear-gradient(rgba(163,184,105,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(163,184,105,.028) 1px,transparent 1px);
  background-size:28px 28px;
}
.page{display:flex;min-height:100vh;flex-direction:column}
/* ---------- Шапка ---------- */
.app-header{
  position:sticky;top:0;z-index:40;border-bottom:1px solid #1c2228;
  background:rgba(10,13,16,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.header-in{max-width:896px;margin:0 auto;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px}
.logo{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:none;padding:0;cursor:pointer;color:inherit}
.logo-box{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid #3d4a2f;background:#161c13;color:#a3b869;border-radius:4px}
.logo-title{display:block;font-size:14px;font-weight:700;letter-spacing:.05em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--foreground)}
.logo-title .sep{color:var(--green-dim)}
.logo-sub{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:#5a626a;margin-top:2px}
nav.main-nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav-btn{display:flex;align-items:center;gap:6px;border:none;background:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:500;color:var(--muted-fg);cursor:pointer;transition:background .15s,color .15s}
.nav-btn:hover{background:#161c22;color:var(--foreground)}
.nav-btn.active{background:#242e1c;color:var(--green)}
.nav-btn.off{opacity:.4;pointer-events:none}
/* ---------- Контент ---------- */
main{max-width:896px;margin:0 auto;width:100%;flex:1;padding:24px 16px}
.stack>*+*{margin-top:24px}
.stack-sm>*+*{margin-top:16px}
/* ---------- Карточки/рамки ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:6px}
.tac-corners{position:relative}
.tac-corners::before,.tac-corners::after{content:"";position:absolute;width:16px;height:16px;pointer-events:none}
.tac-corners::before{top:-1px;left:-1px;border-top:2px solid var(--green-dim);border-left:2px solid var(--green-dim)}
.tac-corners::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--green-dim);border-right:2px solid var(--green-dim)}
.tac-heading{text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.overline{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted-fg)}
.overline.green{color:var(--green-dim)}
.muted{color:var(--muted-fg)}
/* ---------- Кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;border:1px solid transparent;padding:8px 16px;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s,color .15s,border-color .15s;color:var(--foreground);background:none}
.btn:disabled{opacity:.3;cursor:default}
.btn:disabled:hover{background:none}
.btn-lg{height:48px;padding:0 20px;font-size:15px}
.btn-block{width:100%}
.btn-primary{background:var(--primary);color:var(--primary-fg);font-weight:700}
.btn-primary:hover{background:#b3c678}
.btn-outline{border-color:var(--border)}
.btn-outline:hover{background:#161c22}
.btn-deck{border-color:#3d4a2f;color:var(--green)}
.btn-deck:hover{background:#242e1c;color:#cfe08f}
.btn-secondary{background:#1c232a;color:#cfd4d9}
.btn-secondary:hover{background:#242c34}
.btn-ghost{border:none;color:var(--muted-fg)}
.btn-ghost:hover{background:#161c22;color:var(--foreground)}
.btn-danger{border-color:#5a3430;color:var(--red)}
.btn-danger:hover{background:#2e1a17;color:#e0a39a}
.btn-know{background:#2c4a26;color:#cfe08f;border-color:#3d5a34;font-weight:700}
.btn-know:hover{background:#365a2e}
.btn-know:disabled:hover{background:#2c4a26}
.btn-dont{background:#4a2622;color:#e0a39a;border-color:#5a3430;font-weight:700}
.btn-dont:hover{background:#5a2e29}
.btn-dont:disabled:hover{background:#4a2622}
.btn-speak{border-color:#3a4430;padding:8px;flex:none}
.btn-speak:hover{background:#242e1c;color:var(--green)}
.icon-btn{padding:8px}
svg.ic{width:16px;height:16px;flex:none}
svg.ic-lg{width:20px;height:20px;flex:none}
svg.ic-wm{width:96px;height:96px}
/* ---------- Бейджи статуса ---------- */
.badge{display:inline-flex;align-items:center;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:600;line-height:1.4;white-space:nowrap}
.badge-learned{background:#242e1c;color:var(--green);border:1px solid #3d4a2f}
.badge-learning{background:#2e281c;color:var(--amber);border:1px solid #4a4030}
.badge-new{background:transparent;color:var(--muted-fg);border:1px solid var(--border)}
/* ---------- Прогресс-бар ---------- */
.prog{background:#1a2027;border-radius:9999px;overflow:hidden;width:100%}
.prog-fill{height:100%;background:var(--primary);border-radius:9999px;transition:width .35s ease}
/* ---------- Точки статусов ---------- */
.dots{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--muted-fg);flex-wrap:wrap}
.dots span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:9999px}
.dot-g{background:var(--green-dim)}
.dot-a{background:var(--amber)}
.dot-n{background:#3a4430}
/* ---------- Переключатель ---------- */
.switch{position:relative;display:inline-block;width:36px;height:20px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;background:var(--input);border-radius:9999px;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:9999px;background:var(--background);transition:transform .2s}
.switch input:checked + .track{background:var(--primary)}
.switch input:checked + .track::after{transform:translateX(16px)}
/* ---------- Сегменты (направление) ---------- */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:none;border-radius:6px;padding:8px 16px;font-size:14px;color:var(--foreground);cursor:pointer;transition:background .15s,color .15s}
.seg-btn:hover{background:#161c22}
.seg-btn.active{background:#242e1c;color:var(--green)}
/* ---------- Табы ---------- */
.tabs{display:inline-flex;align-items:center;background:#0d1114;border:1px solid var(--border);border-radius:8px;height:36px;padding:3px;gap:2px;max-width:100%}
.tabs.scroll{overflow-x:auto;scrollbar-width:none}
.tabs.scroll::-webkit-scrollbar{display:none}
.tab{border:none;background:none;border-radius:5px;padding:4px 10px;font-size:12px;color:var(--muted-fg);cursor:pointer;white-space:nowrap;height:28px}
.tab:hover{color:var(--foreground)}
.tab.active{background:#0a0d10;color:var(--foreground)}
/* ---------- Поля ---------- */
.input-wrap{position:relative;flex:1;min-width:0}
.input-wrap .lucide-search{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#5a626a;pointer-events:none}
.input{width:100%;background:#0d1114;border:1px solid var(--border);border-radius:6px;height:36px;padding:0 12px 0 36px;color:var(--foreground);font-family:inherit;font-size:14px;outline:none}
.input:focus{border-color:#3d4a2f;box-shadow:0 0 0 2px rgba(61,74,47,.4)}
/* ---------- 3D-карточка ---------- */
.flip-wrap{perspective:1200px}
.flip-inner{position:relative;width:100%;min-height:360px;transform-style:preserve-3d;transition:transform .45s ease-in-out;cursor:pointer;user-select:none;-webkit-user-select:none}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.flip-face.back{transform:rotateY(180deg)}
.face-front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;height:100%}
.face-front .word{font-size:clamp(28px,8vw,48px);font-weight:700;letter-spacing:-.01em;color:#e8e6e0;line-height:1.2;max-width:100%;overflow-wrap:break-word}
.face-back{background:#101610 !important;border-color:#3d4a2f !important;display:flex;flex-direction:column;padding:20px;height:100%;overflow-y:auto}
.word-sm{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--green-dim)}
.word-big{margin-top:4px;font-size:clamp(20px,5vw,26px);font-weight:700;color:#e8e6e0;line-height:1.3}
.hint{font-size:12px;color:#5a626a}
/* ---------- Цитаты ---------- */
.quote{border:1px solid var(--border);background:#0d1114;border-radius:4px;padding:8px 12px}
.quote.lg{padding:16px}
.quote.dashed{border-style:dashed}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.q-speaker{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--green-dim)}
.q-sep{font-size:10px;color:#5a626a}
.q-mission{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted-fg)}
.q-line{margin:0;color:#d5d9c9;line-height:1.6;font-size:14px}
.q-line.ex{color:#9aa1a8;font-style:italic}
/* ---------- Список слов ---------- */
.rows{max-height:62vh;overflow-y:auto}
.row-item+.row-item{border-top:1px solid #1c2228}
.row-head{display:flex;width:100%;align-items:center;gap:12px;padding:12px 16px;text-align:left;background:none;border:none;color:inherit;cursor:pointer;font-family:inherit;font-size:14px}
.row-head:hover{background:#161c22}
.row-num{font-size:10px;color:#4a545e;font-variant-numeric:tabular-nums;width:28px;flex:none}
.row-en{font-weight:600;color:#d5d9c9;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-ru{font-size:14px;color:var(--muted-fg);min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-body{padding:4px 16px 16px}
.chev{flex:none;color:#5a626a;transition:transform .2s}
.chev.open{transform:rotate(180deg)}
/* ---------- История/ошибки ---------- */
.mini-row{display:flex;align-items:center;gap:12px;border:1px solid var(--border);background:#0d1114;border-radius:6px;padding:8px 12px}
.mini-row + .mini-row{margin-top:8px}
.acc-big{font-weight:700;font-variant-numeric:tabular-nums;width:44px;text-align:right;flex:none;font-size:14px}
/* ---------- Скроллбар ---------- */
.scroll-dark::-webkit-scrollbar{width:8px;height:8px}
.scroll-dark::-webkit-scrollbar-track{background:transparent}
.scroll-dark::-webkit-scrollbar-thumb{background:#2b333c;border-radius:4px}
.scroll-dark::-webkit-scrollbar-thumb:hover{background:#3a444f}
/* ---------- Анимации ---------- */
@keyframes tac-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.tac-pulse{animation:tac-pulse 1.6s ease-in-out infinite}
@keyframes tac-fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.tac-fade-up{animation:tac-fade-up .35s ease-out both}
/* ---------- Модальное окно ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;max-width:425px;width:100%}
.dialog h2{margin:0 0 8px;font-size:16px}
.dialog p{margin:0 0 20px;font-size:14px;color:var(--muted-fg);line-height:1.6}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
/* ---------- Подвал ---------- */
footer{margin-top:auto;border-top:1px solid #1c2228}
.footer-in{max-width:896px;margin:0 auto;padding:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#5a626a}
.live{display:inline-flex;align-items:center;gap:6px}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:9999px;background:var(--green-dim)}
/* ---------- Адаптив ---------- */
@media (min-width:640px){
  .decks{grid-template-columns:1fr 1fr}
  .nav-label{display:inline}
  .logo-sub{display:block}
  .row-ru{display:block}
  .kbd-hint{display:inline}
}
@media (max-width:639px){
  .nav-label{display:none}
  .logo-sub{display:none}
  .row-ru{display:none}
  .kbd-hint{display:none}
}
.decks{display:grid;gap:16px;grid-template-columns:1fr}
.deck-grid{display:flex;gap:12px}
@media (max-width:480px){.deck-grid{flex-direction:column}}
.summary-actions{display:flex;gap:12px;flex-direction:column}
@media (min-width:640px){.summary-actions{flex-direction:row}}
.summary-actions .btn{flex:1;height:44px}
</style>
</head>
<body>
<div class="page tac-grid-bg">
  <header class="app-header">
    <div class="header-in">
      <button class="logo" id="logoBtn" aria-label="На главную">
        <span class="logo-box" id="logoIcon"></span>
        <span style="min-width:0;text-align:left">
          <span class="logo-title">MW2 <span class="sep">//</span> ТРЕНАЖЁР СЛОВ</span>
          <span class="logo-sub">Task Force 141 — English Trainer</span>
        </span>
      </button>
      <nav class="main-nav" id="mainNav" aria-label="Основная навигация"></nav>
    </div>
  </header>
  <main id="app"></main>
  <footer>
    <div class="footer-in">
      <span>Фан-тренажёр для изучения английского · Call of Duty: Modern Warfare II © Activision</span>
      <span class="live"><span class="live-dot tac-pulse"></span>прогресс сохраняется в браузере</span>
    </div>
  </footer>
</div>
<div id="modal-root"></div>
<script>
"use strict";
/* ============================================================
 * MW2 // Тренажёр слов — автономная офлайн-версия.
 * Порт React-приложения на чистый JS. Прогресс хранится
 * в localStorage браузера. Работает без интернета.
 * ============================================================ */

const DATA = {"WORDS":[{"id":1,"en":"Copy","ru":"понял / принял","note":"Самое частое слово в игре. «Copy that» = «принял». Полная форма — «I copy».","deck":"comms","quote":{"speaker":"Ghost","line":"Copy that. Moving now.","mission":"Close Air"}},{"id":2,"en":"Roger","ru":"понял / принято","note":"Из старого фонетического алфавита: Roger = R = received. «Roger that» = «принято».","deck":"comms","quote":{"speaker":"Shepherd","line":"Roger that. Confirm when the objective is neutralized.","mission":"Dark Water"}},{"id":3,"en":"Solid copy","ru":"принял полностью / чётко","note":"Усиленное подтверждение: «принял громко и чётко».","deck":"comms","quote":{"speaker":"Ghost","line":"Solid copy! We're taking effective fire! The LZ will be hot!","mission":"Dark Water"}},{"id":4,"en":"Affirm","ru":"подтверждаю / да","note":"Краткая форма от affirmative. В игре часто произносят растянуто: «A-firm».","deck":"comms","quote":{"speaker":"Ghost","line":"Affirm. Good thing your aim isn't shite, like theirs.","mission":"Close Air"}},{"id":5,"en":"Negative","ru":"нет / отрицательно","note":"«Нет» по-военному. Слышится в игре постоянно: «Negative on Hassan» — «Хассана нет».","deck":"comms","quote":{"speaker":"Shadow-1 FCO","line":"Negative. No weapons, no guards.","mission":"Close Air"}},{"id":6,"en":"Standby","ru":"жди / приготовься","note":"Команда ждать и быть готовым. Пишется и произносится раздельно: «Stand by».","deck":"comms","quote":{"speaker":"Graves","line":"We'll open the door for you. Stand by...","mission":"Close Air"}},{"id":7,"en":"Go ahead","ru":"говори / давай","note":"Разрешение передавать. В MW2 чаще звучит «send traffic» — «передавай».","deck":"comms","quote":{"speaker":"Shepherd","line":"Loud and clear, Shadow-1, send traffic.","mission":"Close Air"}},{"id":8,"en":"Say again","ru":"повтори","note":"По рации не говорят «repeat» (это запрос повторного артобстрела) — только «say again».","deck":"comms","quote":{"speaker":"Laswell","line":"All stations, missile is hot! I say again, the missile is launching!","mission":"Countdown"}},{"id":9,"en":"On me","ru":"за мной / ко мне","note":"«Двигайся за мной». Классика Прайса: «On me, Sergeant».","deck":"comms","quote":{"speaker":"Rodolfo","line":"On me -- Go, go...!","mission":"Ghost Team"}},{"id":10,"en":"On your six","ru":"у тебя за спиной","note":"Позиции по «часам»: 12 — прямо, 3 — справа, 6 — сзади, 9 — слева.","deck":"comms","quote":{"speaker":"Price","line":"On your six.","mission":"Ghost Team"}},{"id":11,"en":"Moving","ru":"двигаюсь / выдвигаюсь","note":"Доклад о начале движения. «On the move» — «в пути».","deck":"comms","quote":{"speaker":"Ghost","line":"Copy. Moving!","mission":"Close Air"}},{"id":12,"en":"Holding","ru":"держу позицию","note":"Hold — удерживать позицию или сектор. «Holding his ground» — «не сдаёт позиций».","deck":"comms","quote":{"speaker":"Ghost","line":"We think Graves is in the HQ, holding his ground.","mission":"Ghost Team"}},{"id":13,"en":"Push up","ru":"продвигаемся / давим вперёд","note":"Push — наступать, идти вперёд. «Keep pushing up» — «продолжаем давить».","deck":"comms","quote":{"speaker":"Ghost","line":"Copy. We're pushing to the entrance now.","mission":"Close Air"}},{"id":14,"en":"Fall back","ru":"отступаем","note":"Отойти назад, отступить. Типичная боевая команда при плотном огне противника.","deck":"comms","example":"Fall back! Fall back to the LZ!"},{"id":15,"en":"Hold fire","ru":"не стрелять","note":"«Держать огонь» — не стрелять, пока не прикажут.","deck":"comms","quote":{"speaker":"Alejandro","line":"Hold your fire, we're in the center of the base.","mission":"Ghost Team"}},{"id":16,"en":"Open fire","ru":"огонь! / открыть огонь","note":"Разрешение стрелять звучит как «cleared hot» — «разрешаю огонь».","deck":"comms","quote":{"speaker":"Graves","line":"0-7, copy. Danger close. TV, you're cleared hot. 40 mike-mike.","mission":"Close Air"}},{"id":17,"en":"Cease fire","ru":"прекратить огонь","note":"В игре звучит как «Check fire!» — «прекрати огонь!» (чтобы не задеть своих).","deck":"comms","quote":{"speaker":"Ghost","line":"Shadow-1, check fire! Check fire!","mission":"Close Air"}},{"id":18,"en":"Reloading","ru":"перезаряжаюсь","note":"Обязательный доклад: пока ты перезаряжаешься, тебя прикрывают.","deck":"comms","quote":{"speaker":"Soap","line":"Reloading!","mission":"Dark Water"}},{"id":19,"en":"Cover me","ru":"прикрой меня","note":"Cover — прикрытие. «Cover us!» = «прикройте нас», «I'll cover» = «я прикрою».","deck":"comms","quote":{"speaker":"Graves","line":"2-1, we're moving to secure. Cover us!","mission":"Dark Water"}},{"id":20,"en":"Taking fire","ru":"под огнём / нас обстреливают","note":"Take fire — получать огонь на себя. «Taking effective fire» — «огонь плотный».","deck":"comms","quote":{"speaker":"Ghost","line":"We're taking rocket fire from the water tower!","mission":"Close Air"}},{"id":21,"en":"Contact","ru":"контакт / вижу противника","note":"Обнаружение противника. «Troops in contact» = «наши в бою».","deck":"comms","quote":{"speaker":"Ghost","line":"Contact!","mission":"Close Air"}},{"id":22,"en":"Enemy down","ru":"противник уничтожен","note":"X-ray — вражеский боец по рации. «X-ray down!» = «враг готов».","deck":"comms","quote":{"speaker":"Ghost","line":"X-ray down! Graves, negative on Hassan! It's a dry hole!","mission":"Close Air"}},{"id":23,"en":"Clear","ru":"чисто","note":"Комната или зона зачищена: «Room clear» — «в комнате чисто».","deck":"comms","quote":{"speaker":"Soap","line":"Room clear. Coming out.","mission":"Dark Water"}},{"id":24,"en":"All clear","ru":"всё чисто","note":"Полная проверка завершена, угроз нет.","deck":"comms","quote":{"speaker":"Ghost","line":"All clear!","mission":"Dark Water"}},{"id":25,"en":"Eyes on","ru":"вижу (цель)","note":"«Глаза на цели» = вижу её. «You have eyes on?» = «ты её видишь?».","deck":"comms","quote":{"speaker":"Price","line":"Ghost, we're set. You have eyes on?","mission":"Countdown"}},{"id":26,"en":"Tango down","ru":"цель уничтожена (сленг)","note":"Tango = цель (буква T в фонетическом алфавите). В мультиплеере MW2 звучит «Tango down!».","deck":"comms","quote":{"speaker":"Graves","line":"Target down!","mission":"Dark Water"}},{"id":27,"en":"Exfil","ru":"эвакуация / точка эвакуации","note":"От exfiltration — выход из зоны операции. Антоним — infil (вход в зону).","deck":"comms","quote":{"speaker":"Soap","line":"Alejandro, where's that exfil?","mission":"Close Air"}},{"id":28,"en":"LZ","ru":"зона посадки (вертолёта)","note":"Landing Zone. «The LZ will be hot» — «зона будет под огнём».","deck":"comms","speak":"L Z","quote":{"speaker":"Ghost","line":"Solid copy! We're taking effective fire! The LZ will be hot!","mission":"Dark Water"}},{"id":29,"en":"RTB","ru":"возвращение на базу","note":"Return To Base — «возвращаемся на базу».","deck":"comms","speak":"R T B","example":"Mission complete. Bravo-6, RTB."},{"id":30,"en":"KIA","ru":"убит в бою","note":"Killed In Action. Ранен — WIA (Wounded In Action), пропал — MIA.","deck":"comms","speak":"K I A","example":"Two men KIA, one WIA."},{"id":31,"en":"Weapon","ru":"оружие","note":"Любое оружие. «Weapons hot» = «оружие к бою / на боевой взвод».","deck":"weapons","quote":{"speaker":"Graves","line":"Do you see a weapon on 'em?","mission":"Close Air"}},{"id":32,"en":"Ammo","ru":"патроны / боеприпасы","note":"От ammunition. В игре чаще говорят «rounds» — патроны: «Loading rounds».","deck":"weapons","quote":{"speaker":"Shadow-1 Gunner","line":"Loading rounds. Gun ready.","mission":"Close Air"}},{"id":33,"en":"Mag","ru":"магазин (оружия)","note":"От magazine. Когда меняют магазин — докладывают «Reloading!».","deck":"weapons","example":"Changing mags! Cover me!"},{"id":34,"en":"Suppressor","ru":"глушитель","note":"Suppressed weapon — оружие с глушителем. В миссии «Alone» Соуп собирает глушитель сам.","deck":"weapons","quote":{"speaker":"(ремарка)","line":"Gaz readies his suppressed Lachmann Sub SMG and moves down the tunnel.","mission":"Ghost Team"}},{"id":35,"en":"Sniper","ru":"снайпер","note":"Снайпер или снайперская винтовка. Снайперская поддержка — sniper support.","deck":"weapons","quote":{"speaker":"Shadow Soldier","line":"I need sniper support up on the second floor.","mission":"Ghost Team"}},{"id":36,"en":"Turret","ru":"турель","note":"Закреплённый пулемёт или пушка. Пулемётный огонь — belt-fed fire.","deck":"weapons","example":"Enemy turret ahead! Take cover!"},{"id":37,"en":"Charge","ru":"заряд (взрывчатки)","note":"Breach charge — подрывной заряд для вскрытия дверей.","deck":"weapons","quote":{"speaker":"Price","line":"Charge is set. Get clear.","mission":"Countdown"}},{"id":38,"en":"Detonate","ru":"подорвать / детонировать","note":"Подрыв заряда. Перед подрывом Грейвс считает: «Three, two, one — execute!».","deck":"weapons","quote":{"speaker":"Graves","line":"Going explosive on bridge entry. Three, two, one, execute!","mission":"Dark Water"}},{"id":39,"en":"Breach","ru":"врываться / пробивать вход","note":"Breach — взлом входа: зарядом, «флешкой» или тараном. «Breaching!» = «входим!».","deck":"weapons","quote":{"speaker":"Soap","line":"Breaching.","mission":"Close Air"}},{"id":40,"en":"Flashbang","ru":"светошумовая граната","note":"«Flash out!» = «бросаю флешку!». Ослепляет и оглушает.","deck":"weapons","quote":{"speaker":"Alejandro","line":"Man down! Flash out!","mission":"Dark Water"}},{"id":41,"en":"Smoke","ru":"дымовая (граната)","note":"«Smoke out» = «дымовую бросаю». Дым скрывает движение.","deck":"weapons","quote":{"speaker":"Alejandro","line":"Smoke out.","mission":"Ghost Team"}},{"id":42,"en":"Armor","ru":"броня / бронежилет","note":"Plate — бронепластина в бронежилете: «Round hit the plate» — «пуля попала в пластину».","deck":"weapons","quote":{"speaker":"Soap","line":"He'll be alright. Round hit the plate.","mission":"Close Air"}},{"id":43,"en":"Heli","ru":"вертолёт","note":"Разговорное от helicopter, пишут и helo. «Two helos down on the roof» — «два борта на крышу».","deck":"weapons","quote":{"speaker":"Price","line":"We'll touch two helos down on the roof of the target building...","mission":"Countdown"}},{"id":44,"en":"Drone","ru":"дрон","note":"Разведывательный беспилотник. Запускают, чтобы «подсветить» врага.","deck":"weapons","example":"Drone up. Scanning the area."},{"id":45,"en":"UAV","ru":"беспилотник-разведчик","note":"Unmanned Aerial Vehicle. В мультиплеере UAV показывает врагов на радаре.","deck":"weapons","speak":"U A V","example":"UAV online. Enemy positions marked."},{"id":46,"en":"Convoy","ru":"конвой / колонна","note":"Колонна машин. ETA — estimated time of arrival, «сколько ещё идти/ехать».","deck":"weapons","quote":{"speaker":"Ghost","line":"Shadow-1, what's the ETA on that convoy?","mission":"Close Air"}},{"id":47,"en":"Hostage","ru":"заложник","note":"В финале (Чикаго) AQ берёт заложников. «All hostages secure» — «заложники в безопасности».","deck":"weapons","quote":{"speaker":"Price","line":"Hostages.","mission":"Countdown"}},{"id":48,"en":"VIP","ru":"важная персона","note":"Very Important Person — охраняемое лицо.","deck":"weapons","speak":"V I P","example":"Protect the VIP at all costs."},{"id":49,"en":"Target","ru":"цель","note":"Цель или объект атаки. «Target marked, you're cleared hot» — «цель отмечена, огонь разрешён».","deck":"weapons","quote":{"speaker":"Graves","line":"All right! That's our target.","mission":"Dark Water"}},{"id":50,"en":"Intel","ru":"разведданные","note":"От intelligence. «Intel reports multiple AQ inside» — «по разведке, внутри много AQ».","deck":"weapons","quote":{"speaker":"Gaz","line":"Intel reports multiple AQ inside.","mission":"Countdown"}},{"id":51,"en":"Gunship","ru":"ганшип (самолёт огневой поддержки)","note":"AC-130 Spectre — вся миссия «Close Air» это полёт на ганшипе. «Mike-mike» = мм (калибр).","deck":"weapons","quote":{"speaker":"Graves","line":"Use the 25 mike-mike to limit collateral. Let's make some music.","mission":"Close Air"}},{"id":52,"en":"Thermobaric","ru":"термобарический","note":"Боеприпас объёмного взрыва (fuel-air explosive). Мощнее обычной взрывчатки.","deck":"weapons","example":"Thermobaric warheads — fuel-air explosives."},{"id":53,"en":"Warhead","ru":"боеголовка","note":"Боевая часть ракеты. В «Countdown» Соуп обезвреживает ракету Хассана.","deck":"weapons","quote":{"speaker":"Price","line":"Soap, we find those controls, it's up to you to disarm that missile.","mission":"Countdown"}},{"id":54,"en":"Missile","ru":"ракета","note":"«Missile is hot» = ракета приведена в готовность к запуску.","deck":"weapons","quote":{"speaker":"Laswell","line":"All stations, missile is hot! I say again, the missile is launching!","mission":"Countdown"}},{"id":55,"en":"Silo","ru":"шахта (ракетная)","note":"Подземная пусковая шахта для межконтинентальных ракет.","deck":"weapons","example":"Missile silo located. Two klicks north."},{"id":56,"en":"Stronghold","ru":"опорный пункт / укрепление","note":"Укреплённая позиция противника. Fortified — укреплённый.","deck":"weapons","quote":{"speaker":"Laswell","line":"We believe Hassan is holed up in a fortified server room on the 54th floor.","mission":"Countdown"}},{"id":57,"en":"Checkpoint","ru":"контрольно-пропускной пункт","note":"КПП: блокпост с проверкой документов.","deck":"weapons","example":"Checkpoint ahead. Slow down."},{"id":58,"en":"Ambush","ru":"засада","note":"Устроить засаду — to set up an ambush. Trap — ловушка, синоним.","deck":"weapons","quote":{"speaker":"Alejandro","line":"Be ready for anything, this could be a trap...","mission":"Dark Water"}},{"id":59,"en":"Flank","ru":"фланг / обходить с фланга","note":"Обойти противника сбоку. «They're flanking right!» = «они заходят справа!».","deck":"weapons","quote":{"speaker":"Graves","line":"Soap! Hit the stairs! Flank 'em!","mission":"Dark Water"}},{"id":60,"en":"Extract","ru":"эвакуировать / извлекать","note":"Синоним exfil: забрать людей или груз из зоны операции.","deck":"weapons","quote":{"speaker":"Ghost","line":"Do it. Graves, we're working on exfil now.","mission":"Close Air"}},{"id":61,"en":"Betrayal","ru":"предательство","note":"Завязка финала кампании: в миссии «Alone» Грейвс и Шепард предают TF-141 и Los Vaqueros.","deck":"story","example":"It was a betrayal. Graves turned on us."},{"id":62,"en":"Traitor","ru":"предатель","note":"Тот, кто предал. Глагол — to betray.","deck":"story","example":"Shepherd. The traitor."},{"id":63,"en":"Liar","ru":"лжец","note":"To lie — лгать. Об Алехандро о Валерии: «she's lying» — «она лжёт».","deck":"story","quote":{"speaker":"Alejandro","line":"Yeah, she's lying.","mission":"Countdown"}},{"id":64,"en":"Guarantee","ru":"гарантия / гарантировать","note":"Ключевое слово Грейвса: он «даёт гарантии», а не обещания.","deck":"story","quote":{"speaker":"Graves","line":"I make guarantees.","mission":"Alone","isUserQuote":true}},{"id":65,"en":"Threat","ru":"угроза","note":"Угроза или вражеский боец. «Eliminate all threats» — «уничтожить все угрозы».","deck":"story","quote":{"speaker":"Shepherd","line":"Your orders are to eliminate all threats.","mission":"Dark Water"}},{"id":66,"en":"Negotiation","ru":"переговоры","note":"To negotiate — вести переговоры. Валерия в «Dark Water» торгуется: «In exchange, you will let me go».","deck":"story","example":"No negotiation. We don't deal with terrorists."},{"id":67,"en":"Orders","ru":"приказы","note":"Follow orders — выполнять приказы. Валерия: «I don't take orders anymore» — «мне не приказывают».","deck":"story","quote":{"speaker":"Shepherd","line":"You have your orders, son - Stop that launch...","mission":"Dark Water"}},{"id":68,"en":"Command","ru":"командование / команда","note":"Chain of command — цепь командования. В «Alone» Грейвс отбирает у Алехандро командование базой.","deck":"story","example":"You're relieved of command."},{"id":69,"en":"Relieved","ru":"отстранён (от должности)","note":"Relieve — снять с должности. «Relieved of duty/command» — «отстранён от службы/командования».","deck":"story","example":"You are being relieved of duty."},{"id":70,"en":"Detained","ru":"задержан","note":"To detain — задержать. В «Alone» Грейвс задерживает Алехандро и его людей.","deck":"story","example":"You're detained. Hands where I can see them."},{"id":71,"en":"Survive","ru":"выжить","note":"«Thought we lost you» — «думал, мы тебя потеряли»: Гоуст Соупу после побега в «Alone».","deck":"story","quote":{"speaker":"Ghost","line":"Thought we lost you.","mission":"Alone"}},{"id":72,"en":"Protect","ru":"защищать","note":"Классическое самооправдание Шепарда: «я патриот, защищающий страну».","deck":"story","quote":{"speaker":"Shepherd","line":"I'm a patriot protecting my country.","mission":"Ghost Team"}},{"id":73,"en":"Trust","ru":"доверять / доверие","note":"Trust is earned — доверие заслуживают. Сквозная тема кампании.","deck":"story","example":"Trust me. We'll get through this."},{"id":74,"en":"Regret","ru":"сожалеть / сожаление","note":"Классическая фраза-угроза: «You'll regret this» — «ты об этом пожалеешь».","deck":"story","example":"You'll regret this."},{"id":75,"en":"Mistake","ru":"ошибка","note":"«Big mistake» — «большая ошибка». Фраза из вашего списка звучит в игре не раз.","deck":"story","quote":{"speaker":"—","line":"That was a big mistake.","mission":"кампания MW2","isUserQuote":true}},{"id":76,"en":"Consequence","ru":"последствие","note":"У каждого действия есть последствия — ключевая тема финала кампании.","deck":"story","example":"Every choice has consequences."},{"id":77,"en":"Sacrifice","ru":"жертва / жертвовать","note":"The ultimate sacrifice — «последняя жертва»: погибнуть, выполняя долг.","deck":"story","example":"They sacrificed everything."},{"id":78,"en":"Duty","ru":"долг / служба","note":"«Relieved of duty» — отстранён от службы. Долг солдата — сквозная тема серии.","deck":"story","example":"It's my duty to protect them."},{"id":79,"en":"Honor","ru":"честь","note":"Честь. У Шепарда со честью всё сложно: «To do good, you gotta do some bad».","deck":"story","example":"You have no honor."},{"id /* ---------------- Утилиты ---------------- */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ---------------- Логика прогресса ---------------- */
function wordStatus(p, id) {
  const s = p[id];
  if (!s || (s.right === 0 && s.wrong === 0)) return "new";
  if (s.streak >= 2) return "learned";
  return "learning";
}
function recordAnswer(p, id, correct) {
  const cur = p[id] || { right: 0, wrong: 0, streak: 0, last: 0 };
  const next = correct
    ? { right: cur.right + 1, wrong: cur.wrong, streak: cur.streak + 1, last: Date.now() }
    : { right: cur.right, wrong: cur.wrong + 1, streak: 0, last: Date.now() };
  const out = Object.assign({}, p);
  out[id] = next;
  return out;
}
function deckStats(p, words) {
  let n = 0, l = 0, learned = 0, right = 0, wrong = 0;
  for (const w of words) {
    const st = wordStatus(p, w.id);
    if (st === "new") n++;
    else if (st === "learning") l++;
    else learned++;
    const s = p[w.id];
    if (s) { right += s.right; wrong += s.wrong; }
  }
  const answered = right + wrong;
  return {
    total: words.length, new: n, learning: l, learned, answered,
    accuracy: answered > 0 ? Math.round((right / answered) * 100) : null,
  };
}
function buildQueue(p, words) {
  const q = shuffle(words);
  const hard = q.filter((w) => wordStatus(p, w.id) !== "learned");
  const done = q.filter((w) => wordStatus(p, w.id) === "learned");
  return hard.concat(done);
}

/* ---------------- Озвучка (Web Speech API) ----------------
 * Три известные причины «звук то есть, то нет» на телефонах:
 * 1) iOS Safari и Android Chrome не дают говорить, пока движок
 *    не «разбужен» первым касанием страницы — лечится warm-up
 *    беззвучной репликой на первом тапе;
 * 2) Chrome: cancel() в тот же тик перед speak() глушит озвучку —
 *    пауза только когда что-то уже играет, иначе говорим сразу;
 * 3) Chrome: сборщик мусора выгружает реплику и обрывает звук —
 *    держим ссылку currentUtterance. */
let cachedVoice = null;
let speechOk = false;
let ttsUnlocked = false;
let currentUtterance = null;
let speechStarted = false;  /* onstart последней реплики */
let speechLastError = null; /* not-allowed, synthesis-failed… */
function pickVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  return voices.find((v) => v.lang === "en-US" && /google/i.test(v.name)) ||
    voices.find((v) => v.lang === "en-US") ||
    voices.find((v) => v.lang === "en-GB") ||
    voices.find((v) => (v.lang || "").toLowerCase().indexOf("en") === 0) || null;
}
function refreshVoices() {
  if (!("speechSynthesis" in window)) return 0;
  const voices = window.speechSynthesis.getVoices();
  const was = speechOk;
  speechOk = voices.some((v) => (v.lang || "").toLowerCase().indexOf("en") === 0);
  if (!cachedVoice) cachedVoice = pickVoice();
  if (speechOk !== was && state.view === "home") render();
  return voices.length;
}
function speak(text, rate) {
  if (!("speechSynthesis" in window) || !text) return false;
  try {
    const synth = window.speechSynthesis;
    if (!cachedVoice) cachedVoice = pickVoice();
    const u = new SpeechSynthesisUtterance(text);
    if (cachedVoice) u.voice = cachedVoice;
    u.lang = (cachedVoice && cachedVoice.lang) || "en-US";
    u.rate = rate || 0.92;
    u.pitch = 1;
    u.volume = 1;
    currentUtterance = u;
    speechStarted = false;
    u.onstart = () => { speechStarted = true; speechLastError = null; };
    u.onerror = (ev) => {
      if (ev && ev.error && ev.error !== "interrupted" && ev.error !== "canceled") speechLastError = ev.error;
    };
    if (synth.paused) { try { synth.resume(); } catch (e) { /* ignore */ } }
    /* Android Chrome: cancel() в тот же тик глушит speak(). Если движок
     * молчит — говорим СРАЗУ, внутри жеста (первый тап по деке/кнопке);
    * пауза нужна только когда что-то уже играет. */
    if (synth.speaking || synth.pending) {
      synth.cancel();
      setTimeout(() => { try { synth.speak(u); } catch (e) { speechLastError = e && e.message; } }, 90);
    } else {
      synth.speak(u);
    }
    return true;
  } catch (e) { speechLastError = e && e.message; return false; }
}
/* Разблокировка речи первым касанием/кликом на странице */
function unlockTTS() {
  if (ttsUnlocked || !("speechSynthesis" in window)) return;
  ttsUnlocked = true;
  try {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    u.rate = 2;
    window.speechSynthesis.speak(u);
  } catch (e) { /* ignore */ }
  setTimeout(refreshVoices, 300); /* на Android голоса появляются после первого speak */
}
["pointerdown", "touchend", "keydown", "click"].forEach((ev) => {
  window.addEventListener(ev, unlockTTS, { passive: true });
});
function initSpeech() {
  if (!("speechSynthesis" in window)) return;
  refreshVoices();
  if (typeof window.speechSynthesis.addEventListener === "function") {
    window.speechSynthesis.addEventListener("voiceschanged", refreshVoices);
  }
  /* на телефонах голоса подгружаются с задержкой — опрашиваем несколько раз */
  [500, 1200, 2500, 5000].forEach((ms) => setTimeout(refreshVoices, ms));
}

/* ---------------- Тренировка ---------------- */
function pickDirection(dir) {
  if (dir !== "mix") return dir;
  return Math.random() < 0.5 ? "en-ru" : "ru-en";
}
function startSession(deck) {
  const words = deck === "all" ? WORDS : WORDS.filter((w) => w.deck === deck);
  state.session = {
    deck: deck,
    deckLabel: deck === "all" ? "Все 100 слов" : DECK_MAP[deck].title,
    queueOriginal: words,
    queue: buildQueue(state.progress, words),
    index: 0, flipped: false, right: 0, wrong: 0,
    mistakes: [], summary: false,
    cardDir: pickDirection(state.settings.direction),
  };
  state.view = "session";
  autospeakCurrent();
}
function currentWord() { return state.session ? state.session.queue[state.session.index] : null; }
function autospeakCurrent() {
  const s = state.session;
  if (!s || s.summary) return;
  const w = currentWord();
  if (w && state.settings.autoSpeak && s.cardDir === "en-ru") speak(w.speak || w.en);
}
/* В режиме RU→EN английское слово появляется только на обороте —
 * озвучиваем его в момент переворота карточки. */
function autospeakOnFlip() {
  const s = state.session;
  if (!s || s.summary || !state.settings.autoSpeak) return;
  if (s.cardDir !== "ru-en") return; /* в EN→RU слово уже прозвучало при показе */
  const w = currentWord();
  if (w) speak(w.speak || w.en);
}
function answer(correct) {
  const s = state.session;
  if (!s) return;
  const w = s.queue[s.index];
  if (!w || !s.flipped) return;
  state.progress = recordAnswer(state.progress, w.id, correct);
  lsSet(PROGRESS_KEY, state.progress);
  if (correct) s.right++; else s.wrong++;
  if (!correct) s.mistakes.push(w);
  s.flipped = false;
  if (s.index + 1 >= s.queue.length) {
    s.summary = true;
    finishSession(s.right, s.wrong);
  } else {
    s.index++;
    s.cardDir = pickDirection(state.settings.direction);
    autospeakCurrent();
  }
  render();
}
function finishSession(right, wrong) {
  if (right + wrong === 0) return;
  const rec = { date: Date.now(), deck: state.session.deck, direction: state.settings.direction, total: right + wrong, correct: right };
  state.history = [rec].concat(state.history).slice(0, 30);
  lsSet(HISTORY_KEY, state.history);
}
function exitSession(save) {
  const s = state.session;
  if (s && save && s.right + s.wrong > 0 && !s.summary) finishSession(s.right, s.wrong);
  state.session = null;
  state.view = "home";
  render();
}
function restartSession(words) {
  const s = state.session;
  s.queue = words;
  s.mistakes = []; s.index = 0; s.right = 0; s.wrong = 0;
  s.flipped = false; s.cardDir = pickDirection(state.settings.direction); s.summary = false;
  autospeakCurrent();
  render();
}

function renderSession() {
  const s = state.session;
  const w = currentWord();

  // ===== ИТОГИ =====
  if (s.summary) {
    const answered = s.right + s.wrong;
    const pct = answered > 0 ? Math.round((s.right / answered) * 100) : 0;
    let html = '<div class="stack tac-fade-up">';
    const rank = pct === 100 ? ["🏆", "Легенда"] : pct >= 80 ? ["🎖️", "Ветеран"] : pct >= 60 ? ["🫡", "Боец"] : pct >= 40 ? ["😬", "Новобранец"] : ["💀", "Учебка"];
    html += '<div class="card tac-corners" style="padding:32px 24px;text-align:center">' +
      '<div style="display:flex;justify-content:center;margin-bottom:16px">' +
      '<div style="width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:9999px;border:2px solid #3d4a2f;background:#161c13;font-size:28px" aria-hidden="true">' + rank[0] + "</div></div>" +
      '<h2 class="tac-heading" style="margin:0;font-size:22px">Тренировка завершена</h2>' +
      '<p class="muted" style="margin:4px 0 0;font-size:14px">' + esc(s.deckLabel) + " · ранг: " + rank[1] + "</p>" +
      '<div style="margin-top:24px;display:flex;align-items:center;justify-content:center;gap:32px">' +
      '<div><div style="font-size:36px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">' + pct + "%</div>" +
      '<div style="font-size:12px;color:var(--muted-fg);margin-top:4px">точность</div></div>' +
      '<div style="width:1px;height:48px;background:var(--border)"></div>' +
      '<div style="text-align:left;font-size:14px"><div style="display:flex;align-items:center;gap:8px"><span style="color:#a3b869">' + icon("check") + '</span><span style="font-variant-numeric:tabular-nums">Знаю: ' + s.right + "</span></div>" +
      '<div style="display:flex;align-items:center;gap:8px;margin-top:4px"><span style="color:#d16a5f">' + icon("x") + '</span><span style="font-variant-numeric:tabular-nums">Не знаю: ' + s.wrong + "</span></div></div></div></div>";

    if (s.mistakes.length > 0) {
      html += '<div class="card" style="padding:20px"><p class="overline" style="margin:0 0 12px">Слова с ошибками — повтори (' + s.mistakes.length + ")</p>";
      for (const m of s.mistakes) {
        html += '<div class="mini-row"><div style="min-width:0;flex:1">' +
          '<div style="font-weight:600;color:#d5d9c9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + wEmoji(m) + " " + esc(m.en) + "</div>" +
          '<div style="font-size:12px;color:var(--muted-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.ru) + "</div></div>" +
          speakBtn(m.speak || m.en) + "</div>";
      }
      html += "</div>";
    }

    html += '<div class="summary-actions">';
    if (s.mistakes.length > 0) {
      html += '<button class="btn btn-primary" data-action="redo-mistakes">' + icon("redo") + " Повторить ошибки</button>";
    }
    html += '<button class="btn btn-deck" data-action="restart-session">' + icon("rotate") + " Пройти снова</button>" +
      '<button class="btn btn-secondary" data-action="exit-session">' + icon("home") + " На главную</button></div></div>";
    return html;
  }

  if (!w) {
    return '<div class="card" style="padding:32px;text-align:center"><p class="muted" style="margin:0">Слова не найдены.</p>' +
      '<button class="btn btn-outline" data-action="exit-session" style="margin-top:16px">На главную</button></div>';
  }

  // ===== КАРТОЧКА =====
  const frontIsEn = s.cardDir === "en-ru";
  const frontText = frontIsEn ? w.en : w.ru;
  const sub = DECK_MAP[w.deck].subtitle + (frontIsEn ? " · EN" : " · RU");

  let html = '<div class="stack-sm">';
  html += '<div style="display:flex;align-items:center;gap:12px">' +
    '<button class="btn btn-ghost icon-btn" data-action="exit-session" aria-label="Завершить тренировку">' + icon("x", "ic-lg") + "</button>" +
    '<div style="flex:1;min-width:0"><p class="overline green" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(s.deckLabel) + "</p>" +
    '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:12px;color:var(--muted-fg);margin-top:2px">' +
    '<span style="font-variant-numeric:tabular-nums">' + (s.index + 1) + " / " + s.queue.length + "</span>" +
    '<span style="display:flex;align-items:center;gap:4px"><span style="color:#a3b869">' + icon("check") + '</span><span style="font-variant-numeric:tabular-nums">' + s.right + "</span></span>" +
    '<span style="display:flex;align-items:center;gap:4px"><span style="color:#d16a5f">' + icon("x") + '</span><span style="font-variant-numeric:tabular-nums">' + s.wrong + "</span></span>" +
    '<span class="kbd-hint" style="color:#5a626a">Space — перевернуть · 1 — знаю · 2 — не знаю</span></div></div></div>';

  html += progBar((s.index / s.queue.length) * 100, 6);

  html += '<div class="flip-wrap"><div class="flip-inner' + (s.flipped ? " flipped" : "") + '" id="flipCard" role="button" tabindex="0" aria-label="Карточка слова ' + esc(w.en) + '. Нажмите, чтобы перевернуть">';

  // лицевая сторона
  html += '<div class="flip-face"><div class="card tac-corners face-front">' +
    '<p style="margin:0 0 10px;font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:#5a626a">' + esc(sub) + "</p>" +
    '<div style="font-size:clamp(30px,8vw,42px);line-height:1;margin-bottom:12px" aria-hidden="true">' + wEmoji(w) + "</div>" +
    '<p class="word">' + esc(frontText) + "</p>" +
    '<div style="margin-top:24px">' + (frontIsEn ? speakBtn(w.speak || w.en) : "") + "</div>" +
    '<p class="hint" style="margin:24px 0 0">нажми на карточку или Space — перевернуть</p></div></div>';

  // оборот
  html += '<div class="flip-face back"><div class="card tac-corners face-back">' +
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">' +

    '<p class="word-big">' + esc(w.ru) + "</p></div>" +
    speakBtn(w.speak || w.en) + "</div>" +
    '<p style="margin:12px 0 0;font-size:14px;line-height:1.6;color:#9aa1a8">' + esc(w.note) + "</p>" +
    '<div style="margin-top:auto;padding-top:16px">' + quoteBlock(w, true) + "</div></div></div>";

  html += "</div></div>";

  // кнопки ответа
  html += '<div style="display:flex;gap:12px">' +
    '<button class="btn btn-know btn-lg" style="flex:1" data-action="know"' + (s.flipped ? "" : " disabled") + ">" + icon("check", "ic-lg") + " Знаю</button>" +
    '<button class="btn btn-dont btn-lg" style="flex:1" data-action="dontknow"' + (s.flipped ? "" : " disabled") + ">" + icon("x", "ic-lg") + " Не знаю</button></div>";

  html += "</div>";
  return html;
}

/* ---------------- Словарь ---------------- */
function renderDict() {
  const d = state.dict;
  const q = d.query.trim().toLowerCase();
  const filtered = WORDS.filter((w) => {
    if (d.deck !== "all" && w.deck !== d.deck) return false;
    if (d.status !== "all" && wordStatus(state.progress, w.id) !== d.status) return false;
    if (q && w.en.toLowerCase().indexOf(q) === -1 && w.ru.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });

  const statusTabs = [["all", "все"], ["new", "новые"], ["learning", "учу"], ["learned", "изучено"]];
  const deckTabs = [["all", "Все колоды"]].concat(DECKS.map((x) => [x.id, x.title]));

  let html = '<div class="stack-sm tac-fade-up">';
  html += '<div class="card" style="padding:16px 20px"><div class="stack-sm" style="--gap:16px">';

  // поиск + статусы
  html += '<div style="display:flex;flex-direction:column;gap:12px">' +
    '<div class="input-wrap">' + '<span class="lucide-search">' + icon("search") + "</span>" +
    '<input class="input" id="dictSearch" type="text" value="' + esc(d.query) + '" placeholder="Поиск: слово или перевод…" autocomplete="off" /></div>' +
    '<div class="tabs scroll">' + statusTabs.map((t) =>
      '<button class="tab' + (d.status === t[0] ? " active" : "") + '" data-action="dict-status" data-v="' + t[0] + '">' + t[1] + "</button>"
    ).join("") + "</div></div>";

  // колоды
  html += '<div class="tabs scroll">' + deckTabs.map((t) =>
    '<button class="tab' + (d.deck === t[0] ? " active" : "") + '" data-action="dict-deck" data-v="' + t[0] + '">' + esc(t[1]) + "</button>"
  ).join("") + "</div>";

  html += '<p class="muted" style="margin:0;font-size:12px" id="dictCount">Найдено: ' + filtered.length + " из " + WORDS.length + "</p>";
  html += "</div></div>";

  // список
  html += '<div class="card"><div class="rows scroll-dark" id="dictList">';
  if (filtered.length === 0) {
    html += '<p class="muted" style="padding:24px;text-align:center;font-size:14px;margin:0">Ничего не найдено. Измени фильтры или запрос.</p>';
  }
  for (const w of filtered) {
    const open = d.openId === w.id;
    html += '<div class="row-item" data-row data-deck="' + w.deck + '" data-status="' + wordStatus(state.progress, w.id) + '" data-en="' + esc(w.en.toLowerCase()) + '" data-ru="' + esc(w.ru.toLowerCase()) + '">' +
      '<button class="row-head" data-action="dict-toggle" data-id="' + w.id + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="row-num">' + String(w.id).padStart(2, "0") + "</span>" +
      '<span class="row-en">' + wEmoji(w) + " " + esc(w.en) + "</span>" +
      '<span class="row-ru">' + esc(w.ru) + "</span>" +
      statusBadge(wordStatus(state.progress, w.id)) +
      '<span class="chev' + (open ? " open" : "") + '">' + icon("chevdown") + "</span></button>";
    if (open) {
      html += '<div class="row-body tac-fade-up">' +
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">' +
        '<div><p style="margin:0;font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:#5a626a">перевод</p>' +
        '<p style="margin:2px 0 0;font-size:18px;font-weight:700;color:#e8e6e0">' + esc(w.ru) + "</p></div>" +
        speakBtn(w.speak || w.en) + "</div>" +
        '<p style="margin:12px 0;font-size:14px;line-height:1.6;color:#9aa1a8">' + esc(w.note) + "</p>" +
        quoteBlock(w, true) + "</div>";
    }
    html += "</div>";
  }
  html += "</div></div>";

  html += '<p style="margin:0;font-size:12px;color:#5a626a">* Цитаты с пометкой «*» — из вашего списка слов; точную формулировку в транскриптах миссий сверить не удалось.</p>';
  html += "</div>";
  return html;
}

/* ---------------- Статистика ---------------- */
function renderStats() {
  const overall = deckStats(state.progress, WORDS);
  const pct = Math.round((overall.learned / overall.total) * 100);
  let html = '<div class="stack tac-fade-up">';

  // Общий прогресс
  html += '<div class="card tac-corners" style="padding:24px"><p class="overline" style="margin:0 0 16px">Общий прогресс</p>' +
    '<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">' +
    '<div style="font-size:48px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">' + pct + "%</div>" +
    '<div style="flex:1;min-width:200px">' + progBar(pct, 12) +
    '<div style="margin-top:8px">' + dotsHtml(overall) + "</div>" +
    (overall.accuracy !== null
      ? '<p class="muted" style="margin:8px 0 0;font-size:12px">Общая точность ответов: <span style="color:var(--green);font-variant-numeric:tabular-nums">' + overall.accuracy + "%</span> (" + overall.answered + " ответов)</p>"
      : "") +
    "</div></div></div>";

  // По колодам
  html += '<div class="card" style="padding:24px"><p class="overline" style="margin:0 0 16px">По колодам</p><div class="stack-sm">';
  for (const d of DECKS) {
    const st = deckStats(state.progress, WORDS.filter((w) => w.deck === d.id));
    const p = Math.round((st.learned / st.total) * 100);
    html += "<div><div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px\">" +
      '<span style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(d.title) + "</span>" +
      '<span style="font-size:14px;color:var(--green);font-variant-numeric:tabular-nums;flex:none">' + st.learned + "/" + st.total + " · " + p + "%</span></div>" +
      progBar(p, 8) +
      '<div style="margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">' + dotsHtml(st) +
      (st.accuracy !== null ? '<span style="font-size:11px;color:var(--muted-fg);font-variant-numeric:tabular-nums">точность ' + st.accuracy + "%</span>" : "") +
      "</div></div>";
  }
  html += "</div></div>";

  // История
  html += '<div class="card" style="padding:24px"><p class="overline" style="margin:0 0 16px">История тренировок</p>';
  if (state.history.length === 0) {
    html += '<p class="muted" style="margin:0;font-size:14px">Пока пусто — начни первую тренировку, и результаты появятся здесь.</p>';
  } else {
    html += '<div style="max-height:320px;overflow-y:auto" class="scroll-dark">';
    state.history.forEach((h) => {
      const acc = h.total > 0 ? Math.round((h.correct / h.total) * 100) : 0;
      const deckName = h.deck === "all" ? "Все слова" : (DECK_MAP[h.deck] ? DECK_MAP[h.deck].title : h.deck);
      const dirLabel = h.direction === "en-ru" ? "EN→RU" : h.direction === "ru-en" ? "RU→EN" : "Микс";
      const accColor = acc >= 80 ? "var(--green)" : acc >= 50 ? "var(--amber)" : "var(--red)";
      html += '<div class="mini-row"><span class="acc-big" style="color:' + accColor + '">' + acc + "%</span>" +
        '<div style="min-width:0;flex:1"><p style="margin:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(deckName) + "</p>" +
        '<p style="margin:0;font-size:11px;color:var(--muted-fg)">' +
        new Date(h.date).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) +
        " · " + dirLabel + " · " + h.correct + "/" + h.total + "</p></div></div>";
    });
    html += "</div>";
  }
  html += "</div>";

  // Сброс
  html += '<div class="card" style="padding:20px"><div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">' +
    '<div><p style="margin:0;font-size:14px;font-weight:600">Сбросить прогресс</p>' +
    '<p style="margin:2px 0 0;font-size:12px;color:var(--muted-fg)">Удалит все статусы слов и историю тренировок из этого браузера.</p></div>' +
    '<button class="btn btn-danger" data-action="ask-reset">' + icon("trash") + " Сбросить</button></div></div>";

  html += '<p style="margin:0;font-size:12px;color:#5a626a;line-height:1.6">Прогресс хранится только в вашем браузере (localStorage) — данные не отправляются ни на какие серверы.</p>';
  html += "</div>";
  return html;
}

/* ---------------- Модальное окно сброса ---------------- */
function showResetModal() {
  document.getElementById("modal-root").innerHTML =
    '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">' +
    "<h2>Сбросить весь прогресс?</h2>" +
    "<p>Статусы всех слов и история тренировок будут удалены безвозвратно. Это действие нельзя отменить.</p>" +
    '<div class="dialog-actions">' +
    '<button class="btn btn-outline" data-action="cancel-reset">Отмена</button>' +
    '<button class="btn" style="background:#5a2e29;color:#fff" data-action="confirm-reset">' + icon("check") + " Да, сбросить</button>" +
    "</div></div></div>";
}
function hideResetModal() {
  document.getElementById("modal-root").innerHTML = "";
}

/* ---------------- Навигация ---------------- */
function renderNav() {
  const items = [["home", "Главная", "home"], ["dict", "Словарь", "book"], ["stats", "Статистика", "chart"]];
  const inSession = state.view === "session";
  let html = "";
  for (const it of items) {
    const active = state.view === it[0];
    const off = inSession && it[0] !== "home";
    html += '<button class="nav-btn' + (active ? " active" : "") + (off ? " off" : "") + '" data-action="nav" data-v="' + it[0] + '"' +
      (active ? ' aria-current="page"' : "") + ">" + icon(it[2]) + '<span class="nav-label">' + it[1] + "</span></button>";
  }
  document.getElementById("mainNav").innerHTML = html;
}
function render() {
  renderNav();
  const app = document.getElementById("app");
  if (state.view === "home") app.innerHTML = renderHome();
  else if (state.view === "session") app.innerHTML = renderSession();
  else if (state.view === "dict") app.innerHTML = renderDict();
  else if (state.view === "stats") app.innerHTML = renderStats();
  const fc = document.getElementById("flipCard");
  if (fc) {
    fc.addEventListener("click", () => {
      const s = state.session;
      if (!s || s.summary) return;
      s.flipped = !s.flipped;
      fc.classList.toggle("flipped", s.flipped);
      if (s.flipped) autospeakOnFlip();
      // перерисовываем кнопки ответа
      const know = document.querySelector('[data-action="know"]');
      const dont = document.querySelector('[data-action="dontknow"]');
      if (know) know.disabled = !s.flipped;
      if (dont) dont.disabled = !s.flipped;
    });
  }
}

/* фильтрация списка словаря без перерисовки (не теряем фокус поиска) */
function applyDictFilters() {
  const q = state.dict.query.trim().toLowerCase();
  let count = 0;
  document.querySelectorAll("#dictList [data-row]").forEach((row) => {
    const okDeck = state.dict.deck === "all" || row.getAttribute("data-deck") === state.dict.deck;
    const okStatus = state.dict.status === "all" || row.getAttribute("data-status") === state.dict.status;
    const okQ = !q || row.getAttribute("data-en").indexOf(q) !== -1 || row.getAttribute("data-ru").indexOf(q) !== -1;
    const show = okDeck && okStatus && okQ;
    row.style.display = show ? "" : "none";
    if (show) count++;
  });
  const c = document.getElementById("dictCount");
  if (c) c.textContent = "Найдено: " + count + " из " + WORDS.length;
}

/* ---------------- Обработка кликов ---------------- */
document.getElementById("app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const act = el.getAttribute("data-action");
  if (act === "speak") {
    e.stopPropagation();
    speak(el.getAttribute("data-text"));
    return;
  }
  if (act === "start-deck") { startSession(el.getAttribute("data-deck")); render(); return; }
  if (act === "dir") { state.settings.direction = el.getAttribute("data-dir"); lsSet(SETTINGS_KEY, state.settings); render(); return; }
  if (act === "test-sound") {
    speechStarted = false;
    const modalWasOpen = !!document.querySelector("#modal-root .dialog");
    speak("Copy that. Moving now.");
    /* если через 1.8 с движок так и не заговорил — открываем диагностику */
    setTimeout(() => {
      if (speechStarted) { if (modalWasOpen) showSoundModal(); }
      else showSoundModal();
    }, 1800);
    return;
  }
  if (act === "show-sound") { showSoundModal(); return; }
  if (act === "know") { answer(true); return; }
  if (act === "dontknow") { answer(false); return; }
  if (act === "redo-mistakes") { restartSession(state.session.mistakes.slice()); return; }
  if (act === "restart-session") { restartSession(buildQueue(state.progress, state.session.queueOriginal || fullDeckWords())); return; }
  if (act === "exit-session") { exitSession(true); return; }
  if (act === "dict-toggle") {
    const id = Number(el.getAttribute("data-id"));
    state.dict.openId = state.dict.openId === id ? null : id;
    render();
    return;
  }
  if (act === "dict-status") { state.dict.status = el.getAttribute("data-v"); render(); return; }
  if (act === "dict-deck") { state.dict.deck = el.getAttribute("data-v"); render(); return; }
  if (act === "ask-reset") { showResetModal(); return; }
});

/* клики в модалке */
document.getElementById("modal-root").addEventListener("click", (e) => {
  if (e.target.classList && e.target.classList.contains("overlay")) { hideResetModal(); return; }
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const act = el.getAttribute("data-action");
  if (act === "test-sound") {
    speechStarted = false;
    speak("Copy that. Moving now.");
    setTimeout(() => { if (document.querySelector("#modal-root .dialog")) showSoundModal(); }, 1800);
    return;
  }
  if (act === "hide-sound") { hideResetModal(); return; }
  if (act === "cancel-reset") hideResetModal();
  else if (act === "confirm-reset") {
    try { localStorage.removeItem(PROGRESS_KEY); localStorage.removeItem(HISTORY_KEY); } catch (err) {}
    state.progress = {};
    state.history = [];
    hideResetModal();
    render();
  }
});

/* навигация в шапке */
document.getElementById("mainNav").addEventListener("click", (e) => {
  const el = e.target.closest("[data-action='nav']");
  if (!el) return;
  const v = el.getAttribute("data-v");
  if (state.view === "session" && v !== "home") return;
  state.view = v;
  if (v === "session") return; // недостижимо
  state.session = null; // выход из сессии без сохранения — как в оригинале
  render();
});
document.getElementById("logoBtn").addEventListener("click", () => {
  if (state.view !== "session") { state.view = "home"; render(); }
});

/* переключатель автоозвучки и поиск в словаре */
document.getElementById("app").addEventListener("change", (e) => {
  if (e.target.matches && e.target.matches("[data-setting='autoSpeak']")) {
    state.settings.autoSpeak = e.target.checked;
    lsSet(SETTINGS_KEY, state.settings);
  }
});
document.getElementById("app").addEventListener("input", (e) => {
  if (e.target && e.target.id === "dictSearch") {
    state.dict.query = e.target.value;
    applyDictFilters();
  }
});

/* клавиатура */
window.addEventListener("keydown", (e) => {
  if (state.view !== "session" || !state.session || state.session.summary) return;
  const s = state.session;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.code === "Space" || e.code === "Enter") {
    e.preventDefault();
    if (!s.flipped) {
      s.flipped = true;
      autospeakOnFlip();
      const fc = document.getElementById("flipCard");
      if (fc) {
        fc.classList.add("flipped");
        const know = document.querySelector('[data-action="know"]');
        const dont = document.querySelector('[data-action="dontknow"]');
        if (know) know.disabled = false;
        if (dont) dont.disabled = false;
      }
    } else answer(true);
    return;
  }
  if (!s.flipped) return;
  if (e.key === "1" || e.code === "ArrowLeft") { e.preventDefault(); answer(true); }
  else if (e.key === "2" || e.code === "ArrowRight") { e.preventDefault(); answer(false); }
});

/* полный список слов текущей сессии (для «Пройти снова») */
function fullDeckWords() {
  const deck = state.session.deck;
  return deck === "all" ? WORDS : WORDS.filter((w) => w.deck === deck);
}

/* ---------------- Инициализация ---------------- */
document.getElementById("logoIcon").innerHTML = icon("crosshair");
state.progress = lsGet(PROGRESS_KEY, {});
state.history = lsGet(HISTORY_KEY, []);
state.settings = Object.assign({}, DEFAULT_SETTINGS, lsGet(SETTINGS_KEY, {}));
initSpeech();
render();

</script>
</body>
</html>
